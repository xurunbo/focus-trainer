name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci --legacy-peer-deps > install.log 2>&1

      - name: 诊断-安装日志
        if: failure()
        run: echo "::error::INSTALL_FAILED $(tr '\n' '|' < install.log | tail -c 1500)"

      - name: 构建 H5 产物
        run: npm run build:h5 > build.log 2>&1

      - name: 诊断-构建日志
        if: failure()
        run: echo "::error::BUILD_FAILED $(tr '\n' '|' < build.log | tail -c 2000)"

      # 直接把构建产物推送到 gh-pages 分支发布。
      # 不走 upload-pages-artifact/deploy-pages 官方通道（该通道 2026-11-01 夜间持续故障，
      # 连续 4 次上传失败 exit code 2，构建本身全部成功）；git push 分支通道稳定可靠。
      # 注意：需在仓库 Settings → Pages → Source 选择 "Deploy from a branch: gh-pages /(root)"
      - name: 发布到 gh-pages 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          single-commit: true
